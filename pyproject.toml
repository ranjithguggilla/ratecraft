[project]
name = "ratecraft"
version = "0.1.0"
description = "A motor third-party liability tariff: exposure-offset GLMs, gradient-boosted challengers, and the evaluation a pricing team would ask for"
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["insurance pricing", "actuarial", "glm", "tweedie", "gradient boosting", "motor insurance"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "glum>=3.1",
    "tabmat>=4.0",
    "formulaic>=1.0",
    "lightgbm>=4.3",
    "model-diagnostics>=1.4",
    "polars>=1.0",
    "rdata>=0.11",
    "pyarrow>=15",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "statsmodels>=0.14"]

[project.scripts]
ratecraft-app = "ratecraft.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratecraft"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    # glum reminds us that standard errors ignore the (tiny) ridge penalty.
    "ignore:Covariance matrix estimation assumes:UserWarning",
    # model-diagnostics still uses polars' old string cache internally.
    "ignore:the string cache has been replaced:DeprecationWarning",
]
